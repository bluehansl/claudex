name: claudex-platform-packages

on:
  repository_dispatch:
    types:
      - claudex-platform-packages
  workflow_dispatch:
    inputs:
      version:
        description: "npm release version"
        required: true
      packages:
        description: "Package filter: core, all, win32, linux, darwin, npm tags, package names, or a comma-separated list"
        required: false
        default: "core"
      publish:
        description: "Verify and publish darwin-arm64/root packages through npm OIDC"
        type: boolean
        required: false
        default: false

jobs:
  package:
    permissions:
      contents: read
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: claudex-linux-x64
            npm_tag: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - package: claudex-linux-arm64
            npm_tag: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - package: claudex-darwin-arm64
            npm_tag: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - package: claudex-win32-x64
            npm_tag: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-2022
          - package: claudex-win32-arm64
            npm_tag: win32-arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - name: Check package filter
        shell: bash
        env:
          PACKAGE_FILTER: ${{ github.event.client_payload.packages || inputs.packages || 'core' }}
          MATRIX_PACKAGE: ${{ matrix.package }}
          MATRIX_NPM_TAG: ${{ matrix.npm_tag }}
        run: |
          set -euo pipefail
          should_build=false
          for filter in ${PACKAGE_FILTER//,/ }; do
            case "${filter}" in
              ""|"all"|${MATRIX_PACKAGE}|${MATRIX_NPM_TAG})
                should_build=true
                ;;
              "core")
                case "${MATRIX_NPM_TAG}" in
                  darwin-arm64)
                    should_build=true
                    ;;
                esac
                ;;
              "win32")
                [[ "${MATRIX_NPM_TAG}" == win32-* ]] && should_build=true
                ;;
              "linux")
                [[ "${MATRIX_NPM_TAG}" == linux-* ]] && should_build=true
                ;;
              "darwin")
                [[ "${MATRIX_NPM_TAG}" == darwin-* ]] && should_build=true
                ;;
            esac
          done
          echo "SHOULD_BUILD=${should_build}" >> "$GITHUB_ENV"
          echo "Package filter ${PACKAGE_FILTER}; ${MATRIX_PACKAGE} build=${should_build}"

      - uses: actions/checkout@v5
        if: env.SHOULD_BUILD == 'true'

      - uses: actions/setup-python@v6
        if: env.SHOULD_BUILD == 'true'
        with:
          python-version: "3.x"

      - name: Validate publish inputs before compiling
        if: env.SHOULD_BUILD == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE_FILTER: ${{ inputs.packages }}
        run: python3 scripts/claudex_npm_release.py --version "${VERSION}" --package-filter "${PACKAGE_FILTER}" --check-inputs

      - uses: actions/setup-node@v6
        if: env.SHOULD_BUILD == 'true'
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        if: env.SHOULD_BUILD == 'true'
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Rust target is installed
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        working-directory: codex-rs
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "${TARGET}"

      - name: Compute Cargo cache keys
        if: env.SHOULD_BUILD == 'true'
        id: cache_keys
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from pathlib import Path

          for output, filename in (
              ("lock_hash", "Cargo.lock"),
              ("toolchain_hash", "rust-toolchain.toml"),
          ):
              data = Path(filename).read_bytes()
              print(f"{output}={hashlib.sha256(data).hexdigest()}")
          PY

      - name: Restore Cargo home cache
        if: env.SHOULD_BUILD == 'true'
        id: cache_cargo_home_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-release-${{ steps.cache_keys.outputs.lock_hash }}-${{ steps.cache_keys.outputs.toolchain_hash }}
          restore-keys: |
            cargo-home-${{ matrix.runner }}-${{ matrix.target }}-release-

      - name: Install sccache
        if: env.SHOULD_BUILD == 'true'
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache backend
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using sccache GitHub backend"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> "$GITHUB_ENV"
            echo "Using sccache local disk + actions/cache fallback"
          fi

      - name: Enable sccache wrapper
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$(command -v sccache)"
          if [[ "${RUNNER_OS}" == "Windows" ]] && command -v cygpath >/dev/null 2>&1; then
            wrapper="$(cygpath -w "${wrapper}")"
          fi
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"

      - name: Restore sccache cache (fallback)
        if: env.SHOULD_BUILD == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        id: cache_sccache_restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-release-${{ steps.cache_keys.outputs.lock_hash }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ matrix.runner }}-${{ matrix.target }}-release-${{ steps.cache_keys.outputs.lock_hash }}-
            sccache-${{ matrix.runner }}-${{ matrix.target }}-release-

      - name: Install Linux build dependencies
        if: env.SHOULD_BUILD == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev libubsan1

      - name: Use hermetic Cargo home for musl
        if: env.SHOULD_BUILD == 'true' && contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig for musl
        if: env.SHOULD_BUILD == 'true' && contains(matrix.target, 'unknown-linux-musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: env.SHOULD_BUILD == 'true' && contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rustc UBSan wrapper for musl
        if: env.SHOULD_BUILD == 'true' && contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper="${RUNNER_TEMP}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          # This musl UBSan wrapper intentionally overrides sccache; darwin-arm64 is unaffected.
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - name: Clear sanitizer flags for musl
        if: env.SHOULD_BUILD == 'true' && contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifacts and verify checksums
        if: env.SHOULD_BUILD == 'true'
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build Linux bwrap and export digest
        if: env.SHOULD_BUILD == 'true' && contains(matrix.target, 'linux')
        shell: bash
        working-directory: codex-rs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --target "${TARGET}" --release --bin bwrap
          bwrap_path="target/${TARGET}/release/bwrap"
          digest="$(sha256sum "${bwrap_path}" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap ${bwrap_path} with sha256:${digest}"

      - name: Build release binaries
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        working-directory: codex-rs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          build_args=(--bin claudex --bin codex-code-mode-host)
          if [[ "${TARGET}" == *windows* ]]; then
            build_args+=(--bin codex-command-runner --bin codex-windows-sandbox-setup)
          fi
          cargo build --target "${TARGET}" --release "${build_args[@]}"

      - name: Build symbols archive and strip binaries
        if: env.SHOULD_BUILD == 'true' && contains(matrix.target, 'linux')
        shell: bash
        working-directory: codex-rs
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binaries=(claudex codex-code-mode-host)
          bash "${GITHUB_WORKSPACE}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "${TARGET}" \
            --artifact-name "${PACKAGE}" \
            --release-dir "target/${TARGET}/release" \
            --archive-dir "symbols-dist/${PACKAGE}" \
            --binaries "${binaries[*]}"

      - name: Upload symbols archive
        if: env.SHOULD_BUILD == 'true' && contains(matrix.target, 'linux')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-symbols-${{ github.event.client_payload.version || inputs.version }}
          path: codex-rs/symbols-dist/${{ matrix.package }}/*
          if-no-files-found: error

      - name: Stage npm platform tarball
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          NPM_TAG: ${{ matrix.npm_tag }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.event.client_payload.version || inputs.version || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(python - <<'PY'
          import tomllib

          with open("codex-rs/Cargo.toml", "rb") as fh:
              print(tomllib.load(fh)["workspace"]["package"]["version"])
          PY
            )"
          fi
          echo "CLAUDEX_PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          vendor_root="${GITHUB_WORKSPACE}/.claudex-vendor"
          package_dir="${vendor_root}/vendor/${TARGET}"
          stage_dir="${GITHUB_WORKSPACE}/.claudex-stage-${PACKAGE}"
          output_dir="${GITHUB_WORKSPACE}/dist/npm"
          mkdir -p "${output_dir}"
          package_args=(
            --target "${TARGET}"
            --variant claudex
            --entrypoint-bin "codex-rs/target/${TARGET}/release/claudex"
            --code-mode-host-bin "codex-rs/target/${TARGET}/release/codex-code-mode-host"
            --package-dir "${package_dir}"
            --force
          )
          if [[ "${TARGET}" == *windows* ]]; then
            package_args=(
              --target "${TARGET}"
              --variant claudex
              --entrypoint-bin "codex-rs/target/${TARGET}/release/claudex.exe"
              --code-mode-host-bin "codex-rs/target/${TARGET}/release/codex-code-mode-host.exe"
              --codex-command-runner-bin "codex-rs/target/${TARGET}/release/codex-command-runner.exe"
              --codex-windows-sandbox-setup-bin "codex-rs/target/${TARGET}/release/codex-windows-sandbox-setup.exe"
              --package-dir "${package_dir}"
              --force
            )
          elif [[ "${TARGET}" == *linux* ]]; then
            package_args+=(
              --bwrap-bin "codex-rs/target/${TARGET}/release/bwrap"
            )
          fi

          python scripts/build_codex_package.py "${package_args[@]}"
          python codex-cli/scripts/build_npm_package.py \
            --package "${PACKAGE}" \
            --release-version "${VERSION}" \
            --vendor-src "${vendor_root}/vendor" \
            --staging-dir "${stage_dir}" \
            --pack-output "${output_dir}/claudex-npm-${NPM_TAG}-${VERSION}.tgz"

      - name: Upload npm tarball
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: claudex-npm-${{ matrix.npm_tag }}-${{ env.CLAUDEX_PACKAGE_VERSION }}
          path: dist/npm/claudex-npm-${{ matrix.npm_tag }}-${{ env.CLAUDEX_PACKAGE_VERSION }}.tgz
          if-no-files-found: error

      - name: Save Cargo home cache
        if: always() && !cancelled() && env.SHOULD_BUILD == 'true' && steps.cache_cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/.cargo-home/bin/
            ${{ github.workspace }}/.cargo-home/registry/index/
            ${{ github.workspace }}/.cargo-home/registry/cache/
            ${{ github.workspace }}/.cargo-home/git/db/
          key: cargo-home-${{ matrix.runner }}-${{ matrix.target }}-release-${{ steps.cache_keys.outputs.lock_hash }}-${{ steps.cache_keys.outputs.toolchain_hash }}

      - name: Save sccache cache (fallback)
        if: always() && !cancelled() && env.SHOULD_BUILD == 'true' && env.SCCACHE_GHA_ENABLED != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache/
          key: sccache-${{ matrix.runner }}-${{ matrix.target }}-release-${{ steps.cache_keys.outputs.lock_hash }}-${{ github.run_id }}

      - name: sccache stats
        if: always() && env.SHOULD_BUILD == 'true'
        continue-on-error: true
        run: sccache --show-stats || true

      - name: sccache summary
        if: always() && env.SHOULD_BUILD == 'true'
        shell: bash
        run: |
          {
            echo "### sccache stats — ${{ matrix.target }} (release)";
            echo;
            echo '```';
            sccache --show-stats || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Verify and publish npm
    needs: package
    if: github.repository == 'bluehansl/claudex' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: claudex-npm-publish
      cancel-in-progress: false
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      VERSION: ${{ inputs.version }}
      PACKAGE_FILTER: ${{ inputs.packages }}
      ROOT_TARBALL: dist/npm-root-${{ inputs.version }}/bluehansl-claudex-${{ inputs.version }}.tgz
      PLATFORM_TARBALL: dist/ci-npm/claudex-npm-darwin-arm64-${{ inputs.version }}.tgz
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Validate release identity and verification code
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/claudex_npm_release.py --version "${VERSION}" --package-filter "${PACKAGE_FILTER}" --check-inputs
          python3 -m unittest discover -s scripts -p test_claudex_npm_release.py

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claudex-npm-darwin-arm64-${{ inputs.version }}
          path: dist/ci-npm

      - name: Build matching root package from the same commit
        shell: bash
        run: |
          python3 codex-cli/scripts/build_npm_package.py --package claudex --release-version "${VERSION}" --pack-output "${ROOT_TARBALL}"

      - name: Verify packages and run isolated code-mode smoke
        shell: bash
        run: |
          python3 scripts/claudex_npm_release.py --version "${VERSION}" --root "${ROOT_TARBALL}" --platform "${PLATFORM_TARBALL}" --smoke

      - name: Publish platform before root using npm OIDC
        shell: bash
        run: |
          python3 scripts/claudex_npm_release.py --version "${VERSION}" --package-filter "${PACKAGE_FILTER}" --root "${ROOT_TARBALL}" --platform "${PLATFORM_TARBALL}" --publish

      - name: Verify exact and latest installations in temporary prefixes
        shell: bash
        run: python3 scripts/claudex_npm_release.py --version "${VERSION}" --verify-install

      - name: Release summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Claudex npm release"
            echo "- Version: ${VERSION}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Platform: darwin-arm64"
            echo "- Publish/verification job: ${RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
